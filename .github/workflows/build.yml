name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake pkg-config clang \
            libglib2.0-dev libconfuse-dev libcurl4-openssl-dev libmpdclient-dev

      - name: Configure
        run: |
          NOCONFIGURE=1 ./autogen.sh
          ./configure CC=${{ matrix.cc }} \
            CFLAGS="-O2 -Wall -Wextra -Werror -fno-common"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make check || { cat test-suite.log tests/*.log; exit 1; }
